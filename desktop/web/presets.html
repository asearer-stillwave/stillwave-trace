<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f0c">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trace">
<title>Stillwave Trace · Presets</title>
<link rel="stylesheet" href="/fieldnote.css">
<link rel="stylesheet" href="/content.css">
</head>
<body>
<script src="/nav.js"></script>
<div class="wrap">
  <div class="pre-back-h"><a class="btn sm fm-edit" href="/listen?band=fm" data-back aria-label="Back to FM radio"><span aria-hidden="true">‹</span> FM radio</a><button type="button" class="btn sm fm-edit" id="newP" aria-label="New preset"><span aria-hidden="true">＋</span> New preset</button></div>
  <div class="brand">
    <h1>Preset <span class="acc">settings</span></h1>
  </div>
  <p class="lead">Listen tries settings live. Save keeps them on the preset.</p>
  <div class="now" id="now">Now playing: …</div>
  <div class="row" id="list"></div>
  <form id="form" class="grid2">
    <label>Preset id <input name="id" required></label>
    <label>Display name <input name="name" required></label>
    <label>Frequency <input name="frequency" placeholder="98.705M" required></label>
    <label>SDR gain (dB) <input name="gain" value="4"></label>
    <label>PPM correction <input name="ppm" value="0"></label>
    <label>Audio rate
      <select name="audio_rate">
        <option>16000</option><option>24000</option>
        <option>32000</option>
        <option>44100</option><option selected>48000</option>
      </select>
    </label>
    <label>MP3 bitrate
      <select name="mp3_bitrate">
        <option>64k</option><option>96k</option>
        <option selected>128k</option>
        <option>160k</option><option>192k</option>
      </select>
    </label>
    <label>High-pass Hz <input name="highpass" value="50"></label>
    <label>Low-pass Hz <input name="lowpass" value="8000"></label>
    <div class="span2 row">
      <button type="button" id="listen" class="primary">Listen (don’t save)</button>
      <button type="button" id="save">Save preset</button>
      <button type="button" id="del" class="danger">Delete preset</button>
    </div>
  </form>
  <audio id="player" controls preload="none"></audio>
  <p class="status" id="msg"></p>
  <div class="np-sheet" id="np" hidden role="dialog" aria-modal="true" aria-labelledby="npH"><form class="np-form" id="npF" autocomplete="off">
    <h2 class="np-h" id="npH">New preset</h2>
    <div class="np-band"><button type="button" id="npFM" class="on" aria-pressed="true">FM</button><button type="button" id="npAir" aria-pressed="false">Airband</button></div>
    <label class="np-name">Name <input id="npName" maxlength="40" placeholder="e.g. KPCC"></label>
    <label>Frequency (MHz) <input id="npMhz" inputmode="decimal" placeholder="89.3"></label>
    <label id="npGainL">SDR gain (dB) <input id="npGain" value="4" inputmode="decimal"></label>
    <p class="note np-src" id="npSrc" hidden></p>
    <p class="status np-msg" id="npMsg"></p>
    <div class="np-row"><button type="button" class="primary" id="npSave">Save preset</button><button type="button" id="npCancel">Cancel</button></div>
  </form></div>
  <p class="note">SDR gain snaps to the nearest hardware step. Start low on strong local signals.</p>
</div>
<script src="/mode.js"></script>
<script src="/power.js"></script>
<script src="/screen.js"></script>
<script src="/kbd.js"></script>
<script>
function setMsg(t,k){ const el=document.getElementById('msg'); el.className='status '+(k||''); el.textContent=t||''; }
function formData(){
  const f = document.getElementById('form');
  return {
    id: f.id.value.trim(),
    name: f.name.value.trim(),
    frequency: f.frequency.value.trim(),
    gain: f.gain.value.trim() || '4',
    ppm: f.ppm.value.trim() || '0',
    audio_rate: f.audio_rate.value,
    mp3_bitrate: f.mp3_bitrate.value,
    highpass: f.highpass.value.trim() || '50',
    lowpass: f.lowpass.value.trim() || '8000'
  };
}
function fill(st){
  const f = document.getElementById('form');
  f.id.value = st.id || '';
  f.name.value = st.name || '';
  f.frequency.value = st.frequency || '';
  f.gain.value = st.gain || '4';
  f.ppm.value = st.ppm || '0';
  f.audio_rate.value = st.audio_rate || '48000';
  f.mp3_bitrate.value = st.mp3_bitrate || '128k';
  f.highpass.value = st.highpass || '50';
  f.lowpass.value = st.lowpass || '8000';
}
async function jfetch(url, opt){
  const r = await fetch(url, Object.assign({cache:'no-store'}, opt||{}));
  const t = await r.text();
  let j={}; try{ j=JSON.parse(t);}catch(e){ j={error:t||r.statusText}; }
  if(!r.ok) throw new Error(j.error||('HTTP '+r.status));
  return j;
}
async function reconnect(){
  const readyEnd = Date.now()+15000;
  while(Date.now()<readyEnd){
    try{
      const s = await jfetch('/api/stream-ready');
      if(s.ok) break;
    }catch(e){}
    await new Promise(r=>setTimeout(r,400));
  }
  const old = document.getElementById('player');
  const neu = old.cloneNode(false);
  neu.id='player'; neu.controls=true;
  old.replaceWith(neu);
  neu.src='/play.mp3?ts='+Date.now();
  neu.play().catch(()=>{});
}
async function refresh(){
  const s = await jfetch('/api/status');
  const cur = s.current || {};
  document.getElementById('now').textContent =
    'Now playing: '+(cur.name||'?')+'  '+(cur.frequency||'')+'  gain '+(cur.gain||'')+'  '+(cur.mp3_bitrate||'');
  const box = document.getElementById('list');
  box.innerHTML='';
  (s.stations||[]).forEach(st => {
    const b=document.createElement('button');
    b.className='station'+(cur.id===st.id?' active':'');
    b.textContent=st.name;
    b.onclick=()=>fill(st);
    box.appendChild(b);
  });
  if(cur.id) fill(cur);
}
async function post(path){
  const d = formData();
  if(!d.id || !d.name || !d.frequency) throw new Error('id, name, and frequency are required');
  setMsg('Applying…','ok');
  const j = await jfetch(path,{method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(d)});
  await reconnect();
  await refresh();
  setMsg(j.message||'ok','ok');
}
document.getElementById('listen').onclick = async () => {
  try{ await post('/api/preview'); }catch(e){ setMsg(e.message,'err'); }
};
document.getElementById('save').onclick = async () => {
  try{ await post('/api/preset'); }catch(e){ setMsg(e.message,'err'); }
};
document.getElementById('del').onclick = async () => {
  const d = formData();
  if(!d.id){ setMsg('Pick a preset first','err'); return; }
  if(!confirm('Delete preset '+d.id+' ('+d.name+')?')) return;
  try{
    const j = await jfetch('/api/preset/delete',{method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({id:d.id})});
    await refresh();
    setMsg(j.message||'Deleted','ok');
  }catch(e){ setMsg(e.message,'err'); }
};
refresh().catch(e=>setMsg(e.message,'err'));
// 1.2.6: + New preset. FM -> stations.conf via /api/station (saved, not tuned); Airband -> Listen presets via /api/listen/preset.
// Stations (station bank) opens /presets?new=1&band=air|fm&mhz=..&name=.. to prefill it.
(function(){
  const $ = id => document.getElementById(id);
  let band = 'fm';
  function setBand(b){
    band = b; $('npFM').classList.toggle('on', b === 'fm'); $('npAir').classList.toggle('on', b === 'air');
    $('npFM').setAttribute('aria-pressed', b === 'fm'); $('npAir').setAttribute('aria-pressed', b === 'air');
    $('npGainL').hidden = b === 'air';
    $('npMhz').placeholder = b === 'air' ? '118.700' : '89.3';
    if (b === 'air' && !$('npSrc').dataset.bank) { $('npSrc').hidden = false; $('npSrc').textContent = 'Airband gain is set once for the whole band on Listen › Airband.'; }
    else if (!$('npSrc').dataset.bank) $('npSrc').hidden = true;
  }
  function open(q){
    $('npMsg').textContent = ''; $('npSrc').dataset.bank = ''; $('npSrc').hidden = true;
    $('npName').value = q.get('name') || ''; $('npMhz').value = q.get('mhz') || ''; $('npGain').value = '4';
    $('npH').textContent = q.get('name') ? 'Add to presets' : 'New preset';
    if (q.get('name')) { $('npSrc').dataset.bank = '1'; $('npSrc').hidden = false; $('npSrc').textContent = 'Prefilled from the station bank (' + (q.get('band') === 'air' ? 'FAA' : 'FCC') + '). Check it, then Save.'; }
    setBand(q.get('band') === 'air' ? 'air' : 'fm');
    $('np').hidden = false;
    // 1.3: + New preset jumps to the form: page + sheet back to the top, Name focused (on-screen keyboard opens for it)
    try { window.scrollTo(0, 0); document.scrollingElement.scrollTop = 0; $('npF').scrollTop = 0; } catch (e) {}
    setTimeout(() => { try { $('npName').focus({preventScroll: true}); } catch (e) { $('npName').focus(); } }, 60);
  }
  function close(){ $('np').hidden = true; if (location.search) history.replaceState(null, '', location.pathname); }
  const slug = n => (n.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'preset').slice(0, 24);
  async function save(){
    const name = $('npName').value.trim(), mhz = parseFloat($('npMhz').value.replace(',', '.'));
    const m = t => { $('npMsg').className = 'status np-msg err'; $('npMsg').textContent = t; };
    if (!name) return m('Give it a name.');
    if (band === 'fm' && !(mhz >= 87.5 && mhz <= 108)) return m('FM is 87.5 to 108.0 MHz.');
    if (band === 'air' && !(mhz >= 118 && mhz < 137)) return m('Airband is 118.000 to 136.975 MHz.');
    $('npSave').disabled = true;
    try {
      if (band === 'air') {
        await jfetch('/api/listen/preset', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({band:'airband', mhz, name})});
        setMsg('Saved ' + name + ' to Listen › Airband presets.', 'ok');
      } else {
        const gain = $('npGain').value.trim() || '4';
        let id = slug(name), n = 2, done = false;
        while (!done && n < 9) {
          try { await jfetch('/api/station', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({id, name, freq: mhz.toFixed(3).replace(/0+$/, '') + 'M', gain})}); done = true; }
          catch (e) { if (/already exists/.test(e.message)) id = slug(name).slice(0, 21) + '-' + (n++); else throw e; }
        }
        await refresh();
        setMsg('Saved ' + name + '. Tap it above to play it.', 'ok');
      }
      close();
    } catch (e) { m(e.message); }
    finally { $('npSave').disabled = false; }
  }
  $('newP').onclick = () => open(new URLSearchParams());
  $('npFM').onclick = () => setBand('fm'); $('npAir').onclick = () => setBand('air');
  $('npCancel').onclick = close; $('npSave').onclick = save;
  $('npF').onsubmit = e => { e.preventDefault(); save(); };
  $('np').addEventListener('click', e => { if (e.target === $('np')) close(); });
  const q = new URLSearchParams(location.search); if (q.get('new')) open(q);
})();
</script>
<script>
// 1.2.7: the back button follows where you came from. More links here with ?from=more, so the button reads ‹ More and returns to More;
// without it the button keeps its default target.
(function(){ const f = new URLSearchParams(location.search).get('from'); if (f !== 'more' && f !== 'settings') return;
  const a = document.querySelector('a[data-back]'); if (!a) return;
  a.href = '/settings'; a.setAttribute('aria-label', 'Back to Settings'); a.innerHTML = '<span aria-hidden="true">‹</span> Settings'; })();
</script>
</body>
</html>
