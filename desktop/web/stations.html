<!doctype html>
<html lang="en" style="background:#000;color-scheme:dark">
<head>
<style id="noflash">html,body{background:#000}</style>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f0c">
<title>Stillwave Trace · Stations</title>
<link rel="stylesheet" href="/fieldnote.css">
<link rel="stylesheet" href="/content.css">
</head>
<body class="page-stations">
<script src="/nav.js"></script>
<div class="wrap">
  <div class="sb-hdr"><a class="btn sm fm-edit" href="/listen" data-back aria-label="Back to Listen"><span aria-hidden="true">‹</span> Listen</a></div>
  <div class="brand"><h1>Station <span class="acc">bank</span></h1></div>
  <div class="sb-tabs" id="tabs" role="tablist">
    <button type="button" data-tab="fm">FM</button><button type="button" data-tab="air">Airband</button><button type="button" data-tab="search">Search</button><button type="button" data-tab="near">Near me</button>
  </div>
  <div id="view"><p class="note">Loading…</p></div>
  <p class="status" id="msg"></p>
  <button type="button" class="sb-about" id="foot">About the data ›</button>
  <p class="note" id="footD" hidden>FM: FCC licensing data. Airband: FAA NASR. Receive only, not for navigation.</p>
</div>
<script src="/mode.js"></script>
<script src="/kbd.js"></script>
<script>
(function(){
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
const f3 = m => { m = +m; return m >= 118 ? m.toFixed(3) : m.toFixed(1); };   // airband always 3 decimals, like the Listen tuner
const GL = {tower:'Tower', ground:'Ground', clearance:'Clearance', atis:'ATIS', approach:'Approach', ctaf:'CTAF', unicom:'UNICOM'};
const SN = {AL:'Alabama',AK:'Alaska',AZ:'Arizona',AR:'Arkansas',CA:'California',CO:'Colorado',CT:'Connecticut',DE:'Delaware',DC:'District of Columbia',FL:'Florida',GA:'Georgia',HI:'Hawaii',ID:'Idaho',IL:'Illinois',IN:'Indiana',IA:'Iowa',KS:'Kansas',KY:'Kentucky',LA:'Louisiana',ME:'Maine',MD:'Maryland',MA:'Massachusetts',MI:'Michigan',MN:'Minnesota',MS:'Mississippi',MO:'Missouri',MT:'Montana',NE:'Nebraska',NV:'Nevada',NH:'New Hampshire',NJ:'New Jersey',NM:'New Mexico',NY:'New York',NC:'North Carolina',ND:'North Dakota',OH:'Ohio',OK:'Oklahoma',OR:'Oregon',PA:'Pennsylvania',RI:'Rhode Island',SC:'South Carolina',SD:'South Dakota',TN:'Tennessee',TX:'Texas',UT:'Utah',VT:'Vermont',VA:'Virginia',WA:'Washington',WV:'West Virginia',WI:'Wisconsin',WY:'Wyoming',PR:'Puerto Rico',VI:'Virgin Islands',GU:'Guam',AS:'American Samoa',MP:'N. Mariana Islands'};
const Q = new URLSearchParams(location.search);
let S = {tab: Q.get('v') === 'apt' ? 'air' : (Q.get('v') || localStorage.getItem('traceBankTab') || 'fm'), state: Q.get('state') || localStorage.getItem('traceBankState') || null, city: Q.get('city') || null, apt: Q.get('id') || null,
         q: Q.get('q') || '', band: Q.get('band') || 'air', zip: Q.get('zip') || localStorage.getItem('traceHomeZip') || '', mi: 30, off: 0};
async function J(u){ const r = await fetch(u, {cache:'no-store'}); const d = await r.json().catch(() => ({})); if (!r.ok || d.ok === false) throw new Error(d.error || ('HTTP ' + r.status)); return d; }
function msg(t, k){ const m = $('msg'); m.className = 'status ' + (k || ''); m.innerHTML = (window.traceErr && traceErr.sys(t) ? traceErr.clean(t) : t) || ''; }

// 1.2.9 short names: the bank sends them (x.short, f.short, x.pname; stationnames.py). These are fallbacks only.
const CAP = 14;
const cap = (s, n = CAP) => (s = String(s || '').trim()).length > n ? s.slice(0, n - 1).trimEnd() + '…' : s;
const DROP = /\b(INTERNATIONAL|INTL|AIRPORT|ARPT|REGIONAL|RGNL|MUNICIPAL|MUNI|FIELD|FLD|COUNTY|CO|PUB|PUBLIC|MEMORIAL|MEM|METRO|METROPOLITAN|EXECUTIVE|EXEC|AIR PARK|AIRPARK|ARPK|JETPORT|STATION|SKID STRIP|JRB|NAS|AAF|AFB|ANGB)\b/g;
function aptShort(name, city, short){
  if (short) return short;
  let s = String(name || '').toUpperCase().split(/[\/(]/)[0].replace(DROP, ' ').replace(/\s+/g, ' ').replace(/[-\s]+$/, '').trim();
  if (s.length < 3) s = String(city || '').toUpperCase();
  return cap(s, 14);
}
const FAC = {tower:'TWR', ground:'GND', clearance:'CLR', atis:'ATIS', approach:'APP', ctaf:'CTAF', unicom:'UNIC'};
function side(label){ const l = String(label || '').toUpperCase();
  if (/HELI/.test(l)) return 'HELO'; if (/^ARR\b|\bARR$/.test(l)) return 'ARR'; if (/^DEP\b|\bDEP$/.test(l)) return 'DEP';
  const m = l.match(/^(NORTH|SOUTH|EAST|WEST)\b/); return m ? m[1][0] : ''; }
const presetName = (code, g, label) => cap(g === 'approach' && label ? String(label).toUpperCase().replace(/\s*APPROACH.*|\s*ARTCC.*/,'') + ' APP' : [code, FAC[g] || g.toUpperCase(), side(label)].filter(Boolean).join(' '), 14);
const act = (kind, mhz, name) => `<div class="sb-act"><button type="button" class="primary" data-a="tune" data-k="${kind}" data-mhz="${mhz}" data-name="${esc(name)}">▶ Tune</button><button type="button" data-a="pre" data-k="${kind}" data-mhz="${mhz}" data-name="${esc(name)}">＋ Preset</button></div>`;
const openBtn = id => `<div class="sb-act"><button type="button" data-a="apt" data-id="${esc(id)}">Open ›</button></div>`;
const row = (t, s, a) => `<div class="sb-row"><div class="sb-main"><div class="sb-t">${t}</div><div class="sb-s">${s}</div></div>${a}</div>`;
// 1.3.1: one compact row per station; the city only when it is not the picked city
const rowc = (t, a) => `<div class="sb-row sb-c"><div class="sb-main"><div class="sb-t">${t}</div></div>${a}</div>`;
const crumb = parts => `<div class="sb-crumb">${parts.map(([t, a]) => a ? `<a data-a="${a}">${esc(t)}</a>` : `<b>${esc(t)}</b>`).join(' › ')}</div>`;
// 1.3: STATE ▾ / CITY ▾ pickers (a short list that opens under the button) replace the state grid and city buttons
function picker(kind, label, cur, opts){
  return `<div class="sb-dd" data-dd="${kind}"><button type="button" class="sb-ddb" data-a="dd" data-k="${kind}" aria-haspopup="listbox" aria-expanded="false"><span class="sb-ddk">${label} ▾</span><b>${esc(cur || 'Pick')}</b></button>` +
    `<div class="sb-ddl" role="listbox" hidden>${opts.map(([v, t, n]) => `<button type="button" role="option" class="${t === cur ? 'on' : ''}" data-a="${kind}" data-${kind === 'state' ? 's' : 'c'}="${esc(v)}"><span>${esc(t)}</span><small>${n}</small></button>`).join('')}</div></div>`;
}
async function statePick(band){
  const st = (await J('/api/bank/states?band=' + band)).states;
  return picker('state', 'State', S.state ? (SN[S.state] || S.state) : '', st.map(x => [x.state, SN[x.state] || x.state, x.n]));
}
async function view(){
  document.querySelectorAll('#tabs button').forEach(b => { b.classList.toggle('on', b.dataset.tab === S.tab); b.setAttribute('aria-selected', b.dataset.tab === S.tab); });
  try { localStorage.setItem('traceBankTab', S.tab); } catch (e) {}
  const v = $('view'); let h = '';
  try {
    if (S.tab === 'fm') {
      if (!S.state) h = `<div class="sb-pick">${await statePick('fm')}</div><p class="note">Pick a state to see its FM stations.</p>`;
      else {
        const c = (await J('/api/bank/cities?limit=60&state=' + S.state)).cities;
        if (!S.city) S.city = c.length ? c[0].city : null;
        const s = S.city ? (await J(`/api/bank/fm?state=${S.state}&city=${encodeURIComponent(S.city)}`)).stations : [];
        h = `<div class="sb-pick">${await statePick('fm')}${picker('city', 'City', S.city || '', c.map(x => [x.city, x.city, x.n + ' FM']))}</div>` +
          `<div class="sb-g">${esc(S.city || '')} · ${s.length} stations</div><div class="sb-list">${s.map(x => rowc(`${esc(x.call)}  <span class="sb-f">${f3(x.mhz)}</span>${String(x.city || '').toUpperCase() !== String(S.city || '').toUpperCase() ? '  <span class="sb-cy">· ' + esc(x.city) + '</span>' : ''}`, act('fm', x.mhz, x.call))).join('')}</div>`;
      }
    } else if (S.tab === 'air' && S.apt) {
      const a = await J('/api/bank/airport?id=' + encodeURIComponent(S.apt));
      const code = a.icao || a.id, gs = [...new Set(a.freqs.map(f => f.grp))];
      const grp = g => `<div class="sb-g">${GL[g]}</div><div class="sb-list">${a.freqs.filter(f => f.grp === g).map(f => row(`${FAC[g] || GL[g]} <span class="sb-f">${f3(f.mhz)}</span>`, esc(f.label || code), act('air', f.mhz, f.short || presetName(code, g, f.label)))).join('')}</div>`;
      const half = Math.ceil(gs.length / 2);
      h = crumb([['Airband', 'top'], [SN[a.state] || a.state, 'st'], [code, null]]) + `<p class="note" style="margin:.1rem 0 .5rem">${esc(cap(a.city, 14))}${a.artcc ? ' · Center ' + esc(a.artcc) : ''}${a.towered ? '' : ' · no tower (CTAF)'}</p>
        <div class="row"><button type="button" class="primary" data-a="focus" data-id="${esc(code)}">Focus on map</button><button type="button" data-a="addall">＋ Add all to presets</button></div>
        <div class="sb-cols"><div>${gs.slice(0, half).map(grp).join('')}</div><div>${gs.slice(half).map(grp).join('')}</div></div>`;
      S._apt = a; S.state = a.state;
    } else if (S.tab === 'air') {
      if (!S.state) h = `<div class="sb-pick">${await statePick('air')}</div><p class="note">Pick a state to see its airports.</p>`;
      else {
        const a = (await J(`/api/bank/airports?limit=40&offset=${S.off}&state=${S.state}`)).airports;
        h = `<div class="sb-pick">${await statePick('air')}</div><div class="sb-g">Towered airports first</div><div class="sb-list">${a.map(x => row(`${esc(x.icao || x.id)}  ${esc(aptShort(x.name, x.city, x.short))}`, `${x.towered ? 'TWR' : 'CTAF'} · ${esc(x.city)} · ${x.nf} freqs`, openBtn(x.icao || x.id))).join('')}</div>` +
          `<div class="row sb-more">${S.off ? '<button type="button" data-a="prev">‹ Previous</button>' : ''}${a.length === 40 ? '<button type="button" data-a="next">More airports ›</button>' : ''}</div>`;
      }
    } else if (S.tab === 'search') {
      h = `<form class="sb-search" id="sF"><input id="sQ" value="${esc(S.q)}" placeholder="KBUR, Burbank, KROQ or 118.7" aria-label="Search" autocomplete="off" spellcheck="false"><button type="submit" class="primary">Search</button></form>`;
      if (S.q) {
        const r = (await J('/api/bank/search?q=' + encodeURIComponent(S.q))).results;
        h += `<div class="sb-crumb">${r.length} results</div><div class="sb-list">${r.map(x => x.kind === 'fm' ? row(`${esc(x.call)}  <span class="sb-f">${f3(x.mhz)}</span>`, `FM · ${esc(x.city)}, ${x.state}`, act('fm', x.mhz, x.call)) :
          row(`${esc(x.icao || x.id)}  ${x.mhz ? (FAC[x.grp] || '') + ' <span class="sb-f">' + f3(x.mhz) + '</span>' : esc(aptShort(x.name, x.city, x.short))}`, `${esc(aptShort(x.name, x.city, x.short))} · ${x.state}`, x.mhz ? act('air', x.mhz, (x.pname || presetName(x.icao || x.id, x.grp, ''))) : openBtn(x.icao || x.id))).join('') || '<p class="note">Nothing found. Try a call sign (KROQ), an airport code (BUR or KBUR), a city or a frequency.</p>'}</div>`;
      } else h += '<p class="note">Search by call sign, airport code, city or frequency.</p>';
    } else if (S.tab === 'near') {
      h = `<form class="sb-home" id="zF"><span>Home</span><input id="zIn" value="${esc(S.zip)}" inputmode="numeric" maxlength="5" placeholder="ZIP" aria-label="Home ZIP code"><button type="submit">Set</button><button type="button" data-a="rcv">Use map home</button><span class="sb-tag">${S.mi} mi</span></form>
        <div class="row"><button type="button" class="${S.band === 'fm' ? 'on' : ''}" data-a="band" data-b="fm">FM</button><button type="button" class="${S.band !== 'fm' ? 'on' : ''}" data-a="band" data-b="air">Airband</button></div>`;
      const where = S.zip ? 'zip=' + encodeURIComponent(S.zip) : (S.ll ? `lat=${S.ll[0]}&lon=${S.ll[1]}` : '');
      if (where) {
        const n = await J(`/api/bank/near?${where}&band=${S.band}&mi=${S.mi}&limit=40`);
        h += `<div class="sb-crumb">${n.n} ${S.band === 'fm' ? 'FM stations' : 'airports'} within ${n.mi} mi of ${S.zip ? 'ZIP <b>' + esc(S.zip) + '</b>' : 'the map home position'}</div><div class="sb-list">${n.items.map(x => S.band === 'fm' ? row(`${esc(x.call)}  <span class="sb-f">${f3(x.mhz)}</span>`, `${esc(x.city)} · ${x.mi} mi`, act('fm', x.mhz, x.call)) :
          row(`${esc(x.icao || x.id)}  ${esc(aptShort(x.name, x.city, x.short))}`, `${x.mi} mi${x.tw ? ' · ' + (x.towered ? 'TWR ' : 'CTAF ') + f3(x.tw) : ''}`, x.tw ? `<div class="sb-act"><button type="button" class="primary" data-a="tune" data-k="air" data-mhz="${x.tw}" data-name="${esc((x.icao || x.id) + (x.towered ? ' TWR' : ' CTAF'))}">▶ Tune</button><button type="button" data-a="apt" data-id="${esc(x.icao || x.id)}">Open ›</button></div>` : openBtn(x.icao || x.id))).join('')}</div>`;
      } else h += '<p class="note">No GPS yet: enter your home ZIP code, or use the home position set on the map (Map › settings).</p>';
    }
  } catch (e) {
    h = `<div class="mp-warn"><b>Station bank unavailable.</b> ${esc(traceErr.clean(e.message))}</div>`;
  }
  v.innerHTML = h;
  const sf = $('sF'); if (sf) sf.onsubmit = e => { e.preventDefault(); S.q = $('sQ').value.trim(); view(); };
  const zf = $('zF'); if (zf) zf.onsubmit = e => { e.preventDefault(); S.zip = $('zIn').value.trim(); S.ll = null; try { localStorage.setItem('traceHomeZip', S.zip); } catch (x) {} view(); };
}
async function tune(k, mhz, name){
  msg('Tuning…');
  try {
    const r = await fetch('/api/listen/tune', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(k === 'fm' ? {mhz, demod:'wfm', name, band:'fm'} : {mhz, demod:'am', squelch: 0, name, band:'airband'})});
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || 'tune failed');
    msg(`Playing ${esc(name)} ${f3(mhz)} MHz. <a href="/listen">Open Listen ›</a>`, 'ok');
  } catch (e) { msg(esc(e.message), 'err'); }
}
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-a],[data-tab]'); if (!b) return;
  if (b.dataset.tab) { S.tab = b.dataset.tab; S.apt = null; msg(''); return view(); }
  const a = b.dataset.a;
  if (a === 'top') { S.state = null; S.city = null; S.apt = null; S.off = 0; return view(); }
  if (a === 'st') { S.apt = null; return view(); }
  if (a === 'dd') { const l = b.parentNode.querySelector('.sb-ddl'), open = l.hidden; document.querySelectorAll('.sb-ddl').forEach(x => { x.hidden = true; x.parentNode.querySelector('.sb-ddb').setAttribute('aria-expanded', 'false'); });
    l.hidden = !open; b.setAttribute('aria-expanded', open); if (open) { const on = l.querySelector('.on'); if (on) l.scrollTop = on.offsetTop - l.clientHeight / 2; } return; }
  if (a === 'state') { S.state = b.dataset.s; S.city = null; S.off = 0; try { localStorage.setItem('traceBankState', S.state); } catch (x) {} return view(); }
  if (a === 'city') { S.city = b.dataset.c; return view(); }
  if (a === 'next') { S.off += 40; return view(); }
  if (a === 'prev') { S.off = Math.max(0, S.off - 40); return view(); }
  if (a === 'apt') { S.tab = 'air'; S.apt = b.dataset.id; return view(); }
  if (a === 'band') { S.band = b.dataset.b; return view(); }
  if (a === 'tune') return tune(b.dataset.k, +b.dataset.mhz, b.dataset.name);
  if (a === 'pre') { location.href = `/presets?new=1&band=${b.dataset.k}&mhz=${encodeURIComponent(b.dataset.mhz)}&name=${encodeURIComponent(b.dataset.name)}`; return; }
  if (a === 'focus') { try { localStorage.setItem('traceFocusAirport', b.dataset.id); } catch (x) {} location.href = '/adsb'; return; }
  if (a === 'rcv') { try { const m = await J('/api/maps'); S.ll = [m.receiver.lat, m.receiver.lon]; S.zip = ''; view(); } catch (x) { msg('No map home position.', 'err'); } return; }
  if (a === 'addall' && S._apt) {
    const ap = S._apt, code = ap.icao || ap.id, list = ap.freqs.filter(f => ['tower', 'ground', 'atis', 'approach', 'ctaf', 'clearance'].includes(f.grp)).slice(0, 12);
    msg('Adding ' + list.length + ' frequencies…'); let ok = 0;
    for (const f of list) {
      const name = (f.grp === 'approach' && f.label ? f.label : code + ' ' + GL[f.grp] + (f.label ? ' ' + f.label : '')).slice(0, 40);
      try { const r = await fetch('/api/listen/preset', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({band:'airband', mhz: f.mhz, name})}); if (r.ok) ok++; } catch (x) {}
    }
    msg(`Added ${ok} of ${list.length} to Listen › Airband presets.`, ok === list.length ? 'ok' : 'err');
  }
});
$('foot').onclick = () => $('footD').hidden = !$('footD').hidden;
J('/api/bank/meta').then(m => { $('footD').textContent = `FM: FCC licensing data (${m.fcc_pulled}). Airband: FAA NASR cycle ${m.nasr_cycle} (next ${m.nasr_next}). ${Number(m.counts.fm).toLocaleString()} FM stations · ${Number(m.counts.airport).toLocaleString()} airports. Receive only, not for navigation.`; }).catch(() => {});
view();
})();
</script>
<script>
// 1.2.7: the back button follows where you came from. More links here with ?from=more, so the button reads ‹ More and returns to More;
// without it the button keeps its default target.
(function(){ const f = new URLSearchParams(location.search).get('from'); if (f !== 'more' && f !== 'settings') return;
  const a = document.querySelector('a[data-back]'); if (!a) return;
  a.href = '/settings'; a.setAttribute('aria-label', 'Back to Settings'); a.innerHTML = '<span aria-hidden="true">‹</span> Settings'; })();
</script>
</body>
</html>
