server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location /play.mp3 {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Range "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 7d;
    }

    location /live.mp3 {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1;
        proxy_set_header Range "";
        proxy_set_header Icy-MetaData 0;
        proxy_hide_header Accept-Ranges;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 7d;
    }

    location /api/scan {
        proxy_pass http://127.0.0.1:8080;
        proxy_read_timeout 120s;
    }


    # Spectrum / detect live frames (Server-Sent Events) straight from sdr_scope.py
    location /api/scope/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        add_header Cache-Control "no-store";
        proxy_intercept_errors on;
        error_page 502 504 = @scope_down;
    }

    location @scope_down {
        default_type application/json;
        return 503 '{"error":"spectrum/detect service is not running. Switch the dongle mode first."}';
    }

    location /api/mode {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-store";
    }

    # no trailing slash: "location /api/net/" 301-redirects the bare /api/net status call to a 404
    location /api/net {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        add_header Cache-Control "no-store";
    }

    # Updates page (sdr-update). "Install from file" (1.0.8.2 desktop, 1.0.9 handheld): up to 400m, long timeouts.
    location /api/update {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        client_max_body_size 400m;
        client_body_timeout 600s;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        add_header Cache-Control "no-store";
    }

    # ADS-B map: vendored MapLibre / pmtiles / fonts / sprites (no CDN; works on the hotspot with no internet)
    location /maplib/ {
        root /usr/local/lib/sdr-station/web;
        types {
            application/javascript js mjs;
            text/css css;
            application/json json;
            application/geo+json geojson;
            application/x-protobuf pbf;
            image/png png;
            text/plain txt md;
        }
        add_header Cache-Control "no-cache";
        # a glyph range we did not ship -> empty pbf (MapLibre simply skips those characters)
        location /maplib/fonts/ {
            types { application/x-protobuf pbf; }
            add_header Cache-Control "no-cache";
            try_files $uri /maplib/fonts/empty.pbf;
        }
    }

    # Offline map tiles: one PMTiles file read with HTTP Range requests (nginx serves Range natively)
    location = /maps/la.pmtiles {
        alias /var/lib/sdr/maps/la.pmtiles;
        default_type application/vnd.pmtiles;
        add_header Cache-Control "no-cache";
    }
    # 1.2.6: downloaded map packs (sdr-content), same Range handling; only *.pmtiles, never the .part files
    location ~ "^/maps/packs/[a-z0-9][a-z0-9-]{0,63}\.pmtiles$" {
        root /var/lib/sdr;
        default_type application/vnd.pmtiles;
        add_header Cache-Control "no-cache";
    }
    location = /maps/la.json {
        alias /var/lib/sdr/maps/la.json;
        default_type application/json;
        add_header Cache-Control "no-store";
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-store";
    }
}
